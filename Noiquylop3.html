<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ghép Từ Yêu Thương - Trân Trà</title>
<style>
  :root{
    --sky1:#8ec5fc; --sky2:#e0c3fc; --accent:#ff7eb3; --accent2:#ffb347;
    --panel:#ffffffee; --dark:#3a2e5c; --good:#4caf50; --bad:#e94560;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'Segoe UI', 'Roboto', Arial, sans-serif;
    background:linear-gradient(180deg, var(--sky1), var(--sky2));
    touch-action:none;
  }
  #app{position:fixed; inset:0; width:100%; height:100%;}
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; width:100%; height:100%;
  }
  .screen.active{display:flex;}

  /* ---------- REGISTER SCREEN ---------- */
  #screen-register .panel{
    background:var(--panel); border-radius:24px; padding:clamp(20px,4vw,44px);
    width:min(92vw,440px); box-shadow:0 20px 50px rgba(0,0,0,.25); text-align:center;
  }
  #screen-register h1{
    color:var(--dark); font-size:clamp(20px,4.5vw,28px); margin:0 0 6px;
  }
  #screen-register p.sub{color:#7a6f9b; margin:0 0 22px; font-size:clamp(12px,2.6vw,14px);}
  .field{text-align:left; margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--dark); font-weight:600; margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid #d8cff0;
    font-size:16px; outline:none; transition:.2s;
  }
  .field input:focus{border-color:var(--accent);}
  #btn-start{
    margin-top:8px; width:100%; padding:14px; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff;
    font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(255,126,179,.4);
  }
  #btn-start:active{transform:scale(.97);}
  #reg-error{color:var(--bad); font-size:13px; height:16px; margin-top:8px;}

  /* ---------- GAME SCREEN ---------- */
  #screen-game{align-items:stretch; justify-content:flex-start;}
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px clamp(10px,2vw,20px); background:rgba(255,255,255,.55); backdrop-filter:blur(4px);
    font-weight:700; color:var(--dark); z-index:30; flex-wrap:wrap; gap:6px;
  }
  .pill{
    background:#fff; border-radius:999px; padding:6px 14px; font-size:clamp(12px,2.4vw,15px);
    box-shadow:0 3px 8px rgba(0,0,0,.12); display:flex; align-items:center; gap:6px;
  }
  #timer-pill.warn{color:var(--bad); animation:pulse .8s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  #fs-btn{
    border:none; background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer;
    font-size:16px; box-shadow:0 3px 8px rgba(0,0,0,.12);
  }
  #playfield{
    position:relative; flex:1; width:100%; overflow:hidden;
  }
  .word-chip{
    position:absolute; left:0; top:0; touch-action:none; cursor:grab;
    background:linear-gradient(135deg,#fff,#f1eaff); color:var(--dark);
    padding:9px 16px; border-radius:14px; font-weight:700;
    font-size:clamp(14px,2.6vw,19px); box-shadow:0 6px 14px rgba(60,30,90,.25);
    border:2px solid #d8cff0; white-space:nowrap; will-change:transform;
    transform:translate(-50%,-50%);
  }
  .word-chip.dragging{cursor:grabbing; z-index:50; box-shadow:0 12px 26px rgba(60,30,90,.4); border-color:var(--accent);}
  .word-chip.wrong-flash{animation:shake .35s; border-color:var(--bad) !important;}
  @keyframes shake{
    0%,100%{transform:translate(-50%,-50%) rotate(0deg);}
    25%{transform:translate(-50%,-50%) rotate(-6deg);}
    75%{transform:translate(-50%,-50%) rotate(6deg);}
  }
  .plus-one{
    position:absolute; font-weight:800; font-size:22px; color:var(--good);
    pointer-events:none; z-index:60; animation:floatUp 1s ease-out forwards;
    text-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  @keyframes floatUp{
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-160%) scale(1.4);}
  }
  .merged-chip{
    position:absolute; z-index:55; pointer-events:none; font-weight:800;
    color:#fff; background:linear-gradient(135deg,var(--good),#2e9e46);
    padding:9px 16px; border-radius:14px; font-size:clamp(14px,2.6vw,19px);
    box-shadow:0 8px 16px rgba(0,0,0,.25); transform:translate(-50%,-50%);
    transition:top 1.1s cubic-bezier(.5,-0.2,.7,1.2), left 1.1s cubic-bezier(.5,-0.2,.7,1.2), opacity .3s ease .8s, transform .9s ease;
  }

  /* Player */
  #player-wrap{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:clamp(120px,22vw,220px); pointer-events:none; z-index:20;
    transform-origin:bottom center; animation:sway 2.4s ease-in-out infinite alternate;
  }
  @keyframes sway{0%{transform:translateX(-50%) rotate(-3deg);}100%{transform:translateX(-50%) rotate(3deg);}}
  #basket-target{position:absolute; bottom:6%; left:50%; width:10px; height:10px; pointer-events:none;}

  /* ---------- TRANSITION SCREEN ---------- */
  #screen-transition .box{
    background:var(--panel); padding:36px 44px; border-radius:24px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  #screen-transition h2{color:var(--dark); font-size:clamp(22px,5vw,32px); margin:0 0 8px;}
  #screen-transition p{color:#7a6f9b; margin:0; font-size:14px;}

  /* ---------- END SCREEN ---------- */
  #screen-end{background:linear-gradient(180deg,#1a1030,#3a1f5c); overflow:hidden;}
  #fw-canvas{position:absolute; inset:0; width:100%; height:100%; z-index:1;}
  #end-panel{
    position:relative; z-index:5; background:rgba(255,255,255,.96); border-radius:24px;
    padding:clamp(18px,3vw,32px); width:min(94vw,560px); max-height:88vh; overflow-y:auto;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #end-panel h1{color:var(--accent); font-size:clamp(22px,5vw,30px); margin:0 0 4px;}
  #end-panel .score-big{font-size:clamp(30px,7vw,44px); font-weight:900; color:var(--dark); margin:8px 0;}
  .result-block{text-align:left; margin-top:14px; padding:12px 14px; border-radius:14px; background:#f6f2ff;}
  .result-block h3{margin:0 0 8px; font-size:14px; color:var(--dark);}
  .result-block ul{margin:0; padding-left:18px; font-size:13px; color:#4a4066;}
  .result-block.ok h3{color:var(--good);}
  .result-block.bad h3{color:var(--bad);}
  #end-footer{margin-top:16px; font-size:11px; color:#9a8fc0;}

  #footer-credit{
    position:fixed; left:0; right:0; bottom:0; text-align:center; z-index:200;
    font-size:11px; color:rgba(60,40,90,.55); padding:3px 0; pointer-events:none;
    background:rgba(255,255,255,.25);
  }
</style>
</head>
<body oncontextmenu="return false;">
<div id="app">

  <!-- REGISTER -->
  <div class="screen active" id="screen-register">
    <div class="panel">
      <h1>🎈 Ghép Từ Yêu Thương 🎈</h1>
      <p class="sub">Tách và ghép các từ đơn thành cụm từ đúng!</p>
      <div class="field">
        <label>Họ và tên</label>
        <input type="text" id="inp-name" placeholder="Nhập họ và tên của em" maxlength="30">
      </div>
      <div class="field">
        <label>Lớp</label>
        <input type="text" id="inp-class" placeholder="Ví dụ: 3A8" maxlength="15">
      </div>
      <button id="btn-start">🚀 Bắt đầu chơi</button>
      <div id="reg-error"></div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div id="topbar">
      <div class="pill">📘 Level <span id="lv-num">1</span>/4</div>
      <div class="pill" id="timer-pill">⏱ <span id="timer-txt">03:00</span></div>
      <div class="pill">⭐ Điểm: <span id="score-txt">0</span></div>
      <button id="fs-btn" title="Toàn màn hình">⛶</button>
    </div>
    <div id="playfield">
      <div id="player-wrap"></div>
    </div>
  </div>

  <!-- TRANSITION -->
  <div class="screen" id="screen-transition">
    <div class="box">
      <h2 id="tr-title">Hoàn thành Level 1! 🎉</h2>
      <p id="tr-sub">Chuẩn bị bước sang level tiếp theo...</p>
    </div>
  </div>

  <!-- END -->
  <div class="screen" id="screen-end">
    <canvas id="fw-canvas"></canvas>
    <div id="end-panel">
      <h1 id="end-title">🎉 Chúc mừng! 🎉</h1>
      <p id="end-name" style="color:#4a4066;font-weight:700;"></p>
      <div class="score-big" id="end-score">0 điểm</div>
      <div id="end-lists"></div>
      <div id="end-footer">Designed by Thầy Phạm Ngọc Đức (Bố Trân Trà) 0989658948</div>
    </div>
  </div>

</div>
<div id="footer-credit">Designed by Thầy Phạm Ngọc Đức (Bố Trân Trà) &nbsp;•&nbsp; 0989658948</div>

<script>
(function(){
"use strict";

/* ===================== ANTI VIEW-SOURCE / RIGHT CLICK ===================== */
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('keydown', function(e){
  const k = e.key;
  if(k === 'F12') { e.preventDefault(); return; }
  if(e.ctrlKey && e.shiftKey && (k==='I'||k==='J'||k==='C'||k==='i'||k==='j'||k==='c')){ e.preventDefault(); return; }
  if(e.ctrlKey && (k==='u'||k==='U'||k==='s'||k==='S')){ e.preventDefault(); return; }
});
document.addEventListener('dragstart', e=>{ if(!e.target.closest('.word-chip')) e.preventDefault(); });

/* ===================== DEVICE DETECTION ===================== */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 820;

/* ===================== LEVEL DATA ===================== */
const LEVELS = [
  { phrases:["Đoàn kết","Tôn trọng","Lắng nghe","Thân thiện"] },
  { phrases:["Giúp đỡ","Trung thực","Chia sẻ","Hỏi han","Quan tâm"] },
  { phrases:["Đúng giờ","Chăm chỉ","Hăng hái","Trật tự","Ngăn nắp","Sạch sẽ"] },
  { phrases:["Thành thật","Chăm ngoan","Chịu khó","Lắng nghe","Dễ gần","Khiêm tốn","Lịch sự"]}
];
const LEVEL_TIME = 180; // seconds

/* ===================== STATE ===================== */
let state = {
  name:"", cls:"", level:0, score:0, timeLeft:LEVEL_TIME,
  timerId:null, activeWords:[], matchedByLevel:[[],[],[]],
  totalPhrasesByLevel:[0,0,0], playfieldRect:null, rafId:null, dragging:null,
  wordIdSeq:1
};

/* ===================== AUDIO ===================== */
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type, vol, delay){
  delay = delay||0; vol = vol==null?0.08:vol; type = type||'sine';
  const c = ac(); const t0 = c.currentTime + delay;
  const osc = c.createOscillator(); const g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function noiseBurst(dur, vol, delay){
  delay = delay||0; vol = vol==null?0.08:vol;
  const c = ac(); const t0 = c.currentTime + delay;
  const bufferSize = Math.floor(c.sampleRate*dur);
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const src = c.createBufferSource(); src.buffer = buffer;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t0);
  const filter = c.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=1200;
  src.connect(filter); filter.connect(g); g.connect(c.destination);
  src.start(t0);
}
function sndCorrect(){ tone(523,0.15,'triangle',0.2,0); tone(659,0.15,'triangle',0.2,0.1); tone(784,0.25,'triangle',0.22,0.2); }
function sndWrong(){ tone(160,0.22,'square',0.15,0); }
function sndCollide(){ tone(300,0.06,'sine',0.1,0); }
function sndFanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.28,'triangle',0.22,i*0.13)); }
function sndApplause(){
  for(let i=0;i<40;i++){ noiseBurst(0.05+Math.random()*0.05, 0.06+Math.random()*0.08, Math.random()*3); }
}
function sndFirework(){ noiseBurst(0.4, 0.12, 0); tone(200+Math.random()*300,0.3,'sawtooth',0.05,0.05); }

/* ===================== SCREENS ===================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===================== PLAYER CHARACTER (SVG) ===================== */
function buildPlayer(name){
  const wrap = document.getElementById('player-wrap');
  wrap.innerHTML = `
  <svg id="player-svg" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;overflow:visible;">
    <ellipse cx="110" cy="248" rx="60" ry="10" fill="rgba(0,0,0,.15)"/>
    <!-- basket -->
    <g id="basket-g">
      <path d="M55 205 Q110 235 165 205 L155 235 Q110 250 65 235 Z" fill="#c68642" stroke="#8a5a2b" stroke-width="3"/>
      <path d="M60 208 Q110 190 160 208" fill="none" stroke="#8a5a2b" stroke-width="4"/>
      <path d="M70 210 L75 233 M92 213 L95 236 M128 213 L125 236 M150 210 L145 233" stroke="#8a5a2b" stroke-width="2"/>
    </g>
    <!-- legs -->
    <rect x="85" y="190" width="18" height="40" rx="8" fill="#4a3f7a"/>
    <rect x="117" y="190" width="18" height="40" rx="8" fill="#4a3f7a"/>
    <!-- body / shirt -->
    <rect x="65" y="120" width="90" height="80" rx="26" fill="#ff7eb3"/>
    <text id="shirt-name" x="110" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI, Arial">${name}</text>
    <!-- arms -->
    <rect x="40" y="130" width="30" height="16" rx="8" fill="#ff7eb3" transform="rotate(18 40 130)"/>
    <rect x="150" y="130" width="30" height="16" rx="8" fill="#ff7eb3" transform="rotate(-18 180 130)"/>
    <circle cx="45" cy="178" r="12" fill="#ffd6a5"/>
    <circle cx="175" cy="178" r="12" fill="#ffd6a5"/>
    <!-- head -->
    <circle cx="110" cy="75" r="46" fill="#ffd6a5"/>
    <path d="M64 70 Q110 15 156 70 Q156 40 110 32 Q64 40 64 70 Z" fill="#3a2e5c"/>
    <circle cx="92" cy="75" r="6" fill="#3a2e5c"/>
    <circle cx="128" cy="75" r="6" fill="#3a2e5c"/>
    <circle cx="75" cy="85" r="7" fill="#ff9eb5" opacity=".6"/>
    <circle cx="145" cy="85" r="7" fill="#ff9eb5" opacity=".6"/>
    <path id="mouth" d="M92 98 Q110 108 128 98" fill="none" stroke="#3a2e5c" stroke-width="4" stroke-linecap="round"/>
  </svg>`;
  // mouth talking animation
  const mouth = document.getElementById('mouth');
  const shapes = [
    "M92 98 Q110 108 128 98",
    "M90 98 Q110 116 130 98",
    "M94 100 Q110 104 126 100",
    "M92 98 Q110 112 128 98"
  ];
  let mi = 0;
  setInterval(()=>{ mi = (mi+1)%shapes.length; if(mouth) mouth.setAttribute('d', shapes[mi]); }, 420);
}
function basketPoint(){
  const svg = document.querySelector('#player-svg');
  const pf = document.getElementById('playfield').getBoundingClientRect();
  if(!svg) return {x:pf.width/2, y:pf.height-40};
  const r = svg.getBoundingClientRect();
  return { x: r.left - pf.left + r.width*0.5, y: r.top - pf.top + r.height*0.82 };
}

/* ===================== WORD SPAWNING & FLOATING ===================== */
function splitPhrase(phrase, phraseIndex){
  return phrase.split(' ').map((w,partIndex)=>({
    id: 'w'+(state.wordIdSeq++), text:w, phraseIndex, partIndex
  }));
}
function initLevel(idx){
  state.level = idx;
  state.timeLeft = LEVEL_TIME;
  const level = LEVELS[idx];
  state.totalPhrasesByLevel[idx] = level.phrases.length;
  state.matchedByLevel[idx] = [];
  document.getElementById('lv-num').textContent = idx+1;
  const pf = document.getElementById('playfield');
  pf.querySelectorAll('.word-chip').forEach(el=>el.remove());
  let words = [];
  level.phrases.forEach((p,pi)=>{ words = words.concat(splitPhrase(p,pi)); });
  // shuffle
  for(let i=words.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [words[i],words[j]]=[words[j],words[i]]; }
  state.activeWords = words;
  const rect = pf.getBoundingClientRect();
  state.playfieldRect = rect;
  const maxY = rect.height*0.72;
  words.forEach(w=>{
    w.x = 40 + Math.random()*(rect.width-80);
    w.y = 40 + Math.random()*(Math.max(maxY-40,60));
    const speed = 30 + Math.random()*25;
    const ang = Math.random()*Math.PI*2;
    w.vx = Math.cos(ang)*speed; w.vy = Math.sin(ang)*speed;
    w.el = document.createElement('div');
    w.el.className = 'word-chip';
    w.el.textContent = w.text;
    w.el.dataset.id = w.id;
    pf.appendChild(w.el);
    attachPointer(w);
    positionEl(w);
  });
  startTimer();
  runAnimation();
}
function positionEl(w){
  w.el.style.left = w.x+'px';
  w.el.style.top = w.y+'px';
}

/* ===================== ANIMATION LOOP ===================== */
let lastTs = null;
function runAnimation(){
  cancelAnimationFrame(state.rafId);
  lastTs = null;
  function step(ts){
    if(lastTs==null) lastTs = ts;
    let dt = (ts-lastTs)/1000; if(dt>0.05) dt=0.05;
    lastTs = ts;
    const pf = document.getElementById('playfield');
    const rect = pf.getBoundingClientRect();
    const maxY = rect.height*0.72;
    state.activeWords.forEach(w=>{
      if(state.dragging && state.dragging.id===w.id) return;
      w.x += w.vx*dt; w.y += w.vy*dt;
      const halfW = (w.el.offsetWidth||60)/2, halfH = (w.el.offsetHeight||30)/2;
      if(w.x < halfW){ w.x = halfW; w.vx *= -1; }
      if(w.x > rect.width-halfW){ w.x = rect.width-halfW; w.vx *= -1; }
      if(w.y < halfH+10){ w.y = halfH+10; w.vy *= -1; }
      if(w.y > maxY-halfH){ w.y = maxY-halfH; w.vy *= -1; }
      positionEl(w);
    });
    state.rafId = requestAnimationFrame(step);
  }
  state.rafId = requestAnimationFrame(step);
}

/* ===================== POINTER / DRAG ===================== */
function attachPointer(w){
  w.el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if(!actx) ac();
    state.dragging = w;
    w.el.classList.add('dragging');
    w.el.setPointerCapture(e.pointerId);
  });
  w.el.addEventListener('pointermove', function(e){
    if(state.dragging !== w) return;
    const pf = document.getElementById('playfield').getBoundingClientRect();
    w.x = e.clientX - pf.left;
    w.y = e.clientY - pf.top;
    positionEl(w);
  });
  w.el.addEventListener('pointerup', function(e){
    if(state.dragging !== w) return;
    w.el.classList.remove('dragging');
    state.dragging = null;
    handleDrop(w);
  });
}
function overlap(a,b){
  const ra = a.el.getBoundingClientRect(), rb = b.el.getBoundingClientRect();
  return !(ra.right<rb.left || ra.left>rb.right || ra.bottom<rb.top || ra.top>rb.bottom);
}
function handleDrop(w){
  let target = null;
  for(const other of state.activeWords){
    if(other.id===w.id) continue;
    if(overlap(w,other)){ target = other; break; }
  }
  if(!target){ 
    // small random re-launch
    const ang = Math.random()*Math.PI*2; const speed=30+Math.random()*20;
    w.vx = Math.cos(ang)*speed; w.vy = Math.sin(ang)*speed;
    return;
  }
  sndCollide();
  if(target.phraseIndex === w.phraseIndex && target.partIndex !== w.partIndex){
    successMatch(w, target);
  } else {
    failMatch(w, target);
  }
}
function failMatch(a,b){
  sndWrong();
  [a,b].forEach(w=>{
    w.el.classList.add('wrong-flash');
    setTimeout(()=>w.el.classList.remove('wrong-flash'), 350);
    const ang = Math.random()*Math.PI*2; const speed=40+Math.random()*25;
    w.vx = Math.cos(ang)*speed; w.vy = Math.sin(ang)*speed;
  });
}
function successMatch(a,b){
  sndCorrect();
  state.score++;
  document.getElementById('score-txt').textContent = state.score;
  const phrase = LEVELS[state.level].phrases[a.phraseIndex];
  state.matchedByLevel[state.level].push(phrase);

  const pf = document.getElementById('playfield');
  const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2;

  // +1 floating
  const plus = document.createElement('div');
  plus.className='plus-one'; plus.textContent='+1';
  plus.style.left = midX+'px'; plus.style.top = midY+'px';
  pf.appendChild(plus);
  setTimeout(()=>plus.remove(), 1000);

  // merged chip falling to basket
  const ordered = a.partIndex < b.partIndex ? [a,b] : [b,a];
  const merged = document.createElement('div');
  merged.className='merged-chip';
  merged.textContent = ordered[0].text+' '+ordered[1].text;
  merged.style.left = midX+'px'; merged.style.top = midY+'px';
  pf.appendChild(merged);
  const bp = basketPoint();
  requestAnimationFrame(()=>{
    merged.style.left = bp.x+'px';
    merged.style.top = bp.y+'px';
    merged.style.opacity = '0';
    merged.style.transform = 'translate(-50%,-50%) scale(.3)';
  });
  setTimeout(()=>merged.remove(), 1200);

  // remove words
  [a,b].forEach(w=>{
    w.el.remove();
    state.activeWords = state.activeWords.filter(x=>x.id!==w.id);
  });

  if(state.activeWords.length===0){
    clearInterval(state.timerId);
    setTimeout(()=>endLevel(true), 900);
  }
}

/* ===================== TIMER ===================== */
function fmt(s){ const m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function startTimer(){
  clearInterval(state.timerId);
  document.getElementById('timer-txt').textContent = fmt(state.timeLeft);
  document.getElementById('timer-pill').classList.remove('warn');
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    document.getElementById('timer-txt').textContent = fmt(Math.max(state.timeLeft,0));
    if(state.timeLeft<=20) document.getElementById('timer-pill').classList.add('warn');
    if(state.timeLeft<=0){
      clearInterval(state.timerId);
      endLevel(false);
    }
  },1000);
}

/* ===================== LEVEL / GAME FLOW ===================== */
function endLevel(){
  cancelAnimationFrame(state.rafId);
  if(state.level < LEVELS.length-1){
    showTransition(state.level+2);
    setTimeout(()=>{
      initLevel(state.level+1);
      showScreen('screen-game');
    }, 2200);
  } else {
    setTimeout(()=>showEnd(), 400);
  }
}
function showTransition(nextLevelNum){
  document.getElementById('tr-title').textContent = 'Hoàn thành Level '+(nextLevelNum-1)+'! 🎉';
  document.getElementById('tr-sub').textContent = 'Chuẩn bị bước sang Level '+nextLevelNum+'...';
  sndFanfare();
  showScreen('screen-transition');
}

/* ===================== END SCREEN / FIREWORKS ===================== */
function showEnd(){
  showScreen('screen-end');
  document.getElementById('end-name').textContent = state.name + (state.cls?(' — Lớp '+state.cls):'');
  document.getElementById('end-score').textContent = state.score + ' điểm';
  let html = '';
  LEVELS.forEach((lv,i)=>{
    const matched = state.matchedByLevel[i];
    const unmatched = lv.phrases.filter(p=>!matched.includes(p));
    html += '<div class="result-block ok"><h3>Level '+(i+1)+' — Đã ghép đúng ('+matched.length+'/'+lv.phrases.length+')</h3><ul>'+
      (matched.length? matched.map(p=>'<li>'+p+'</li>').join('') : '<li><em>Chưa có</em></li>')+'</ul></div>';
    if(unmatched.length){
      html += '<div class="result-block bad"><h3>Level '+(i+1)+' — Chưa hoàn thành</h3><ul>'+
        unmatched.map(p=>'<li>'+p+'</li>').join('')+'</ul></div>';
    }
  });
  document.getElementById('end-lists').innerHTML = html;
  sndApplause();
  startFireworks();
}
let fwCtx=null, fwParticles=[], fwRunning=false, fwLauncherId=null;
function startFireworks(){
  const canvas = document.getElementById('fw-canvas');
  const resize = ()=>{ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
  resize(); window.addEventListener('resize', resize);
  fwCtx = canvas.getContext('2d');
  fwParticles = [];
  fwRunning = true;
  function launch(){
    if(!fwRunning) return;
    const cx = canvas.width*(0.15+Math.random()*0.7);
    const cy = canvas.height*(0.2+Math.random()*0.35);
    const hue = Math.floor(Math.random()*360);
    const count = 34+Math.floor(Math.random()*18);
    for(let i=0;i<count;i++){
      const ang = (Math.PI*2*i)/count + Math.random()*0.2;
      const speed = 60+Math.random()*140;
      fwParticles.push({
        x:cx,y:cy, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        life:1, color:'hsl('+hue+',95%,'+(55+Math.random()*20)+'%)'
      });
    }
    sndFirework();
  }
  let elapsed=0;
  function loop(){
    if(!fwRunning) return;
    fwCtx.clearRect(0,0,canvas.width,canvas.height);
    fwCtx.globalCompositeOperation='lighter';
    fwParticles.forEach(p=>{
      p.vy += 90*0.016;
      p.x += p.vx*0.016; p.y += p.vy*0.016;
      p.life -= 0.012;
      if(p.life>0){
        fwCtx.beginPath();
        fwCtx.fillStyle = p.color;
        fwCtx.globalAlpha = Math.max(p.life,0);
        fwCtx.arc(p.x,p.y,2.6,0,Math.PI*2);
        fwCtx.fill();
      }
    });
    fwCtx.globalAlpha = 1;
    fwParticles = fwParticles.filter(p=>p.life>0);
    requestAnimationFrame(loop);
  }
  loop();
  launch();
  fwLauncherId = setInterval(launch, 750);
  setTimeout(()=>{ if(fwLauncherId) clearInterval(fwLauncherId); fwLauncherId=setInterval(launch,1800); }, 9000);
}

/* ===================== FULLSCREEN ===================== */
function tryFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(req){ req.call(el).catch(()=>{}); }
}
document.getElementById('fs-btn').addEventListener('click', ()=>{
  if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); }
  else tryFullscreen();
});
if(IS_MOBILE){ document.getElementById('fs-btn').style.display='none'; }

/* ===================== START FLOW ===================== */
document.getElementById('btn-start').addEventListener('click', ()=>{
  const name = document.getElementById('inp-name').value.trim();
  const cls = document.getElementById('inp-class').value.trim();
  const err = document.getElementById('reg-error');
  if(!name || !cls){ err.textContent = 'Vui lòng nhập đầy đủ họ tên và lớp!'; return; }
  err.textContent = '';
  state.name = name; state.cls = cls; state.score = 0;
  document.getElementById('score-txt').textContent = 0;
  ac();
  if(!IS_MOBILE) tryFullscreen();
  buildPlayer(name);
  showScreen('screen-game');
  initLevel(0);
});

window.addEventListener('resize', ()=>{
  state.playfieldRect = document.getElementById('playfield').getBoundingClientRect();
});

})();
</script>
